<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>研習報到統計看板 - 原資增能獎勵報到系統</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      -webkit-font-smoothing: antialiased; 
      -moz-osx-font-smoothing: grayscale;
    }
    
    body, html { 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      overflow-x: hidden;
    }
    
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://irc.fju.edu.tw/resources/20260601125036407.jpg'); 
      background-size: 100% auto; 
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(6px); 
      opacity: 0.25;     
      z-index: -1;
    }
    
    .nav-bar { 
      display: flex; 
      gap: 16px; 
      width: 95%; 
      max-width: 650px; 
      margin-top: 30px; 
      z-index: 10; 
      flex-shrink: 0;
    }
    .nav-btn { 
      flex: 1; 
      padding: 22px 16px; 
      background: rgba(240, 240, 240, 0.85); 
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: #444444; 
      border: 2px solid #dddddd; 
      border-radius: 20px; 
      text-decoration: none; 
      text-align: center; 
      font-weight: bold; 
      font-size: 22px; 
      transition: all 0.2s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .nav-btn:hover {
      background: #e5e5e5;
      color: #222222;
    }
    .nav-btn.active { 
      background: #cc1111; 
      color: #ffffff;      
      border-color: #cc1111;
      box-shadow: 0 8px 25px rgba(204, 17, 17, 0.4);
    }

    .card { 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 35px 25px; 
      border-radius: 36px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.12), 0 8px 20px rgba(0,0,0,0.06); 
      width: 95%; 
      max-width: 960px; 
      text-align: center; 
      margin: 30px 0 60px 0;
      border: 1px solid rgba(0, 0, 0, 0.08); 
      overflow: hidden; 
    }
    
    h2 {
      color: #222222; 
      font-weight: bold;
      font-size: 30px; 
      margin-bottom: 20px;
    }
    
    input, select { 
      border: 2px solid #e0e0e0; 
      border-radius: 14px; 
      transition: all 0.2s;
      background-color: rgba(255, 255, 255, 0.95);
      color: #222222; 
      box-sizing: border-box;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #cc1111; 
      background-color: #ffffff;
    }

    .table-container { 
      width: 100%; 
      overflow-x: auto; 
      background: rgba(255, 255, 255, 0.95); 
      border-radius: 20px; 
      margin-top: 20px; 
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.01);
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 15px; 
      text-align: left; 
    }
    th, td { 
      padding: 14px 14px; 
      border-bottom: 1px solid #eeeeee; 
      white-space: nowrap;
      color: #333333; 
    }
    th { 
      background-color: #f7f7f7; 
      color: #555555; 
      font-weight: bold;
      border-bottom: 2px solid #e0e0e0;
    }

    .badge-status-yes {
      background: #e6f4ea;
      color: #137333;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }
    .badge-status-no {
      background: #fce8e6;
      color: #c5221f;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }
    .badge-travel {
      background: #e8f0fe;
      color: #1a73e8;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
    }

    /* 檢視模式切換器 */
    .view-mode-group {
      display: inline-flex;
      background: rgba(225, 225, 225, 0.7);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .view-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #555555;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: none;
      margin: 0;
      width: auto;
    }
    .view-btn:hover {
      color: #111111;
    }
    .view-btn.active {
      background: #ffffff;
      color: #cc1111;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    /* 卡片檢視容器與項目樣式 */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 15px;
      text-align: left;
    }
    .person-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 18px;
      border: 1px solid #ebebeb;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border-left: 6px solid #d32f2f; /* 未報到預設紅邊 */
    }
    .person-card.checked-in {
      border-left: 6px solid #2e7d32; /* 已報到綠邊 */
      background: #fcfffc;
    }
    .person-card:hover {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card-badge-id {
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .card-badge-group {
      background: #fce8e6;
      color: #c5221f;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .card-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-name {
      font-size: 24px;
      font-weight: 800;
      color: #1b1b1b;
      letter-spacing: 0.5px;
    }
    .card-reward {
      font-size: 14px;
      color: #374151;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #edf2f7;
      line-height: 1.4;
    }
    .card-reward-label {
      font-weight: 700;
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px dashed #e5e7eb;
      font-size: 13px;
    }

    /* 手機螢幕優化 */
    @media (max-width: 650px) {
      .card {
        padding: 22px 14px;
        border-radius: 24px;
        margin: 15px 0 40px 0;
      }
      h2 {
        font-size: 24px;
      }
      .nav-bar {
        margin-top: 18px;
      }
      .nav-btn {
        font-size: 18px;
        padding: 14px 10px;
        border-radius: 16px;
      }
      .cards-container {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .view-btn {
        padding: 6px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="nav-btn">報到頁面</a>
    <a href="query.html" class="nav-btn active">查詢看板</a>
  </div>
  
  <div class="card">
    <h2 style="margin-top:0;">大會報到即時看板</h2>
    <div id="diag" style="background:#fff3e0; padding:10px; border-radius:10px; margin-bottom:15px; font-size:14px; color:#e65100; font-weight:bold;">⏳ 正在連線讀取名冊...</div>
    
    <!-- 統計看板區塊 -->
    <div style="background:rgba(255,255,255,0.85); padding:18px; border-radius:18px; border:1px solid #ddd; margin-bottom:18px;">
      <div style="display:flex; justify-content:space-around; flex-wrap: wrap; gap: 15px;">
        <div>應到總人數：<span id="cTotal" style="font-size:26px; font-weight:bold; color:#222;">0</span> 人</div>
        <div>已報到：<span id="cIn" style="font-size:26px; font-weight:bold; color:#2e7d32;">0</span> 人</div>
        <div>未報到：<span id="cNot" style="font-size:26px; font-weight:bold; color:#d32f2f;">0</span> 人</div>
      </div>
      <div style="text-align:center; margin-top:12px; border-top:1px solid #eee; padding-top:10px; color:#666; font-size: 14px;">
        目前篩選條件顯示：<span id="fTotal" style="font-weight:bold; color:#cc1111; font-size: 18px;">0</span> 人
        <button onclick="fetchAdminData()" style="margin-left:15px; padding:4px 14px; font-size:13px; width:auto; border-radius:8px; display:inline-block; margin-top:0; box-shadow:none;">🔄 重新整理</button>
      </div>
    </div>
    
    <!-- 篩選列 -->
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:15px; flex-wrap: wrap; align-items: center;">
      <input type="text" id="searchKeyword" oninput="draw()" placeholder="🔍 搜尋姓名、身分證、編號或獎勵項目..." style="max-width: 100%; width: 100%; padding: 14px; font-size: 16px; text-align: left;">
      
      <!-- 狀態篩選 -->
      <select id="fStatus" onchange="draw()" style="flex: 1; min-width: 130px; padding: 12px; font-size: 15px;">
        <option value="all">所有報到狀態</option>
        <option value="in">已報到</option>
        <option value="not">未報到</option>
      </select>
      
      <!-- 組別篩選 -->
      <select id="fGroup" onchange="draw()" style="flex: 1; min-width: 130px; padding: 12px; font-size: 15px;">
        <option value="all">所有組別</option>
      </select>

      <!-- 獎勵項目篩選 -->
      <select id="fReward" onchange="draw()" style="flex: 1; min-width: 130px; padding: 12px; font-size: 15px;">
        <option value="all">所有獎勵項目</option>
      </select>
    </div>

    <!-- 檢視模式切換列 -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 18px 0 8px 0; flex-wrap: wrap; gap: 10px;">
      <div style="font-size: 14px; color: #555; font-weight: bold;">
        名單檢視方式：
      </div>
      <div class="view-mode-group">
        <button type="button" id="btnViewTable" class="view-btn" onclick="setViewMode('table')">📋 表格檢視</button>
        <button type="button" id="btnViewCard" class="view-btn" onclick="setViewMode('card')">🗂️ 卡片檢視</button>
      </div>
    </div>

    <!-- 卡片檢視區塊 (手機友善) -->
    <div id="cardsContainer" class="cards-container"></div>

    <!-- 表格檢視區塊 (移除身分證字號，版面更清爽) -->
    <div class="table-container" id="tableContainer">
      <table>
        <thead>
          <tr>
            <th style="width: 15%; text-align: center;">編號</th>
            <th style="width: 25%;">姓名</th>
            <th style="width: 40%;">獎勵項目</th>
            <th style="width: 20%; text-align: center;">報到狀態</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <script>
    let db = [];
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwQnQrRL0rWlM50-KTjrx2iC8xtYTvoL9e-NL56EiDE7dU_SsgnGT-45eoY3apswwE1xA/exec";
    let API_URL = localStorage.getItem("CIP_GAS_URL") || DEFAULT_GAS_URL;

    // 檢視模式：優先讀取使用者記憶，手機預設為卡片 (card)，電腦預設為表格 (table)
    let currentViewMode = localStorage.getItem("CIP_VIEW_MODE") || (window.innerWidth <= 768 ? "card" : "table");

    window.onload = function() {
      updateViewModeUI();
      fetchAdminData();
    };

    function setViewMode(mode) {
      currentViewMode = mode;
      localStorage.setItem("CIP_VIEW_MODE", mode);
      updateViewModeUI();
    }

    function updateViewModeUI() {
      const tableContainer = document.getElementById('tableContainer');
      const cardsContainer = document.getElementById('cardsContainer');
      const btnTable = document.getElementById('btnViewTable');
      const btnCard = document.getElementById('btnViewCard');

      if (currentViewMode === 'card') {
        if (tableContainer) tableContainer.style.display = 'none';
        if (cardsContainer) cardsContainer.style.display = 'grid';
        if (btnTable) btnTable.classList.remove('active');
        if (btnCard) btnCard.classList.add('active');
      } else {
        if (tableContainer) tableContainer.style.display = 'block';
        if (cardsContainer) cardsContainer.style.display = 'none';
        if (btnTable) btnTable.classList.add('active');
        if (btnCard) btnCard.classList.remove('active');
      }
    }

    async function fetchAdminData() {
      const d = document.getElementById('diag');
      d.innerHTML = "⏳ 正在更新名冊數據...";
      d.style.background = "#fff3e0"; 
      d.style.color = "#e65100";

      if (API_URL) {
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "getAdminData" })
          });
          const result = await res.json();
          if (result.success) {
            d.innerHTML = "✅ 連線成功 (共 " + result.data.length + " 筆名單)";
            d.style.background = "#e8f5e9"; 
            d.style.color = "#2e7d32";
            db = result.data; 
            initFilters();
            draw();
          } else {
            d.innerHTML = "❌ 失敗: " + (result.error || "未知錯誤");
            d.style.background = "#ffebee"; 
            d.style.color = "#d32f2f";
          }
        } catch (err) {
          d.innerHTML = "❌ 連線錯誤: " + err.toString();
          d.style.background = "#ffebee"; 
          d.style.color = "#d32f2f";
        }
      } else {
        // 展示模式模擬資料
        d.innerHTML = "💡 展示模式 (模擬資料)";
        d.style.background = "#e8f0fe"; 
        d.style.color = "#1967d2";
        db = [
          ["001", "第一組", "A123456789", "陳大文", "語文競賽特優", "2026-08-20 08:45:12", "是"],
          ["002", "第二組", "B234567890", "李曉明", "原民專門人才卓越獎", "", "否"],
          ["003", "第一組", "C123987654", "張小美", "學術專利深造獎勵", "2026-08-20 09:12:00", "是"],
          ["004", "第三組", "D223344556", "王志明", "專題研究計畫甲等", "", "是"]
        ];
        initFilters();
        draw();
      }
    }

    function initFilters() {
      const groupSet = new Set();
      const rewardSet = new Set();

      // 索引 1: 組別, 索引 4: 獎勵項目
      db.forEach(r => {
        if (r[1] && String(r[1]).trim() !== "") groupSet.add(String(r[1]).trim());
        if (r[4] && String(r[4]).trim() !== "") rewardSet.add(String(r[4]).trim());
      });

      const fGroup = document.getElementById('fGroup');
      const fReward = document.getElementById('fReward');

      fGroup.innerHTML = '<option value="all">所有組別</option>';
      Array.from(groupSet).sort().forEach(g => {
        fGroup.innerHTML += `<option value="${g}">${g}</option>`;
      });

      fReward.innerHTML = '<option value="all">所有獎勵項目</option>';
      Array.from(rewardSet).sort().forEach(rw => {
        fReward.innerHTML += `<option value="${rw}">${rw}</option>`;
      });
    }

    function draw() {
      const keyword = document.getElementById('searchKeyword').value.trim().toUpperCase();
      const sStatus = document.getElementById('fStatus').value;
      const sGroup = document.getElementById('fGroup').value;
      const sReward = document.getElementById('fReward').value;
      const tb = document.getElementById('tb');
      const cardsContainer = document.getElementById('cardsContainer');

      tb.innerHTML = "";
      cardsContainer.innerHTML = "";

      let countIn = 0;
      let countNot = 0;
      let countFiltered = 0;

      let tableHtml = "";
      let cardsHtml = "";

      db.forEach(r => {
        // 7 欄位結構對應：
        // r[0]: 編號
        // r[1]: 組別
        // r[2]: 身分證字號 (僅供後台比對及關鍵字搜尋，不再直接列出)
        // r[3]: 姓名
        // r[4]: 獎勵項目
        // r[5]: 報到時間
        // r[6]: 交通費核銷否
        const idNo = r[0] || '-';
        const groupName = r[1] || '-';
        const rawId = r[2] || '';
        const name = r[3] || '-';
        const reward = r[4] || '-';
        const checkInTime = r[5] ? String(r[5]).trim() : '';

        const isCheckedIn = (checkInTime !== "");
        if (isCheckedIn) countIn++;
        else countNot++;

        // 搜尋過濾 (仍支援用身分證號搜尋，但結果不顯示)
        const matchKeyword = (keyword === "") ||
          String(idNo).toUpperCase().includes(keyword) ||
          String(rawId).toUpperCase().includes(keyword) ||
          String(name).toUpperCase().includes(keyword) ||
          String(reward).toUpperCase().includes(keyword) ||
          String(groupName).toUpperCase().includes(keyword);

        // 狀態過濾
        let matchStatus = true;
        if (sStatus === "in") matchStatus = isCheckedIn;
        if (sStatus === "not") matchStatus = !isCheckedIn;

        // 組別過濾
        const matchGroup = (sGroup === "all") || (groupName === sGroup);

        // 獎勵項目過濾
        const matchReward = (sReward === "all") || (reward === sReward);

        if (matchKeyword && matchStatus && matchGroup && matchReward) {
          countFiltered++;

          const timeOnly = checkInTime ? (checkInTime.split(' ')[1] || checkInTime) : '';

          let tableStatusBadge = isCheckedIn 
            ? `<span class="badge-status-yes">✅ 已報到<br><small style="font-size:11px; color:#555;">${timeOnly}</small></span>` 
            : `<span class="badge-status-no">未報到</span>`;

          let cardStatusBadge = isCheckedIn
            ? `<span class="badge-status-yes" style="font-size:12px; padding:3px 10px;">✅ 已報到 <small style="color:#555;">${timeOnly}</small></span>`
            : `<span class="badge-status-no" style="font-size:12px; padding:3px 10px;">未報到</span>`;

          // 1. 表格列 HTML (簡潔 4 欄：編號、姓名、獎勵項目、報到狀態)
          tableHtml += `
            <tr style="background:${isCheckedIn ? 'rgba(230, 244, 234, 0.3)' : 'none'};">
              <td style="text-align:center; font-weight:bold; color:#1a73e8;">${idNo}</td>
              <td><b>${name}</b></td>
              <td>${reward}</td>
              <td style="text-align:center;">${tableStatusBadge}</td>
            </tr>
          `;

          // 2. 卡片 HTML (適合手機瀏覽，清爽且資訊聚焦)
          cardsHtml += `
            <div class="person-card ${isCheckedIn ? 'checked-in' : ''}">
              <div class="card-top">
                <span class="card-badge-id">#${idNo}</span>
                ${cardStatusBadge}
              </div>
              <div class="card-name-row">
                <div class="card-name">${name}</div>
              </div>
              <div class="card-reward">
                <div class="card-reward-label">獎勵項目</div>
                <div style="font-weight:600; color:#222;">${reward}</div>
              </div>
            </div>
          `;
        }
      });

      if (countFiltered === 0) {
        tb.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 30px; color:#888;">查無符合條件的學員資料</td></tr>`;
        cardsContainer.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 40px 20px; color:#888; font-size:15px; background:rgba(255,255,255,0.7); border-radius:16px;">查無符合條件的學員資料</div>`;
      } else {
        tb.innerHTML = tableHtml;
        cardsContainer.innerHTML = cardsHtml;
      }

      document.getElementById('cTotal').innerText = db.length;
      document.getElementById('cIn').innerText = countIn;
      document.getElementById('cNot').innerText = countNot;
      document.getElementById('fTotal').innerText = countFiltered;

      updateViewModeUI();
    }
  </script>
</body>
</html>
