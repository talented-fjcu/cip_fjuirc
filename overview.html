<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>大會即時綜合檢視看板</title>

  <!-- 引入 Firebase SDK (相容模式 CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      -webkit-font-smoothing: antialiased; 
    }
    body, html { 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; 
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 95%;
      max-width: 860px;
      margin: 25px 0 60px 0;
    }

    /* 頂部標題列 (依需求規定：嚴格禁止放置回到 rollcall.html 的連結) */
    .header-box {
      background: #ffffff;
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      font-size: 24px;
      font-weight: bold;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .read-only-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse-green 1.8s infinite;
    }
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* 五個階段切換按鈕列 (需求：上面有五個按鈕可以篩選要顯示哪個階段的資料) */
    .stage-tabs-container {
      margin-bottom: 18px;
    }
    .stage-tabs-label {
      font-size: 14px;
      font-weight: bold;
      color: #4b5563;
      margin-bottom: 8px;
    }
    .stage-tabs-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .stage-tab-btn {
      flex: 1;
      min-width: 95px;
      padding: 12px 10px;
      border-radius: 16px;
      border: 2px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .stage-tab-btn:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }
    .stage-tab-btn.active {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
    }
    .stage-tab-btn.is-locked {
      border-color: #f87171;
    }

    /* 統計指標卡片 */
    .overview-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      text-align: center;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .stat-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .stat-num {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
    }

    /* 搜尋列 */
    .search-box {
      margin-bottom: 18px;
    }
    .search-bar {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      background: #ffffff;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .search-bar:focus {
      border-color: #1e3a8a;
    }

    /* 唯讀名單表格卡片 */
    .content-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.07);
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    /* 列表佈局：6 欄依序為「組別」|「編號」|「姓名」|「報到情況」|「整隊」|「檢錄」 */
    .view-row {
      display: grid;
      grid-template-columns: 85px 85px 1.4fr 1.2fr 105px 105px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      gap: 12px;
    }
    .view-row:last-child {
      border-bottom: none;
    }
    .view-header {
      background: #f8fafc;
      font-weight: bold;
      color: #475569;
      font-size: 14px;
      border-bottom: 2px solid #e2e8f0;
    }

    .v-group {
      font-size: 14px;
    }
    .badge-group {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid #bfdbfe;
      white-space: nowrap;
    }
    .mobile-only-id {
      display: none;
    }

    .v-id {
      font-weight: bold;
      color: #334155;
      font-size: 16px;
    }
    .v-name {
      font-weight: bold;
      font-size: 18px;
      color: #0f172a;
    }

    /* 狀態標籤 (純檢視，不可點擊) */
    .badge-checkin-yes {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #166534;
      background: #dcfce7;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
    }
    .badge-checkin-no {
      display: inline-flex;
      align-items: center;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
    }

    /* 整隊與檢錄圖示 (純檢視) */
    .v-badge-done {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1.5px solid #86efac;
      padding: 6px 12px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 14px;
      width: 100%;
    }
    .v-badge-empty {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #f8fafc;
      color: #94a3b8;
      border: 1.5px dashed #cbd5e1;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 13px;
      width: 100%;
    }

    /* 手機螢幕優化 */
    @media (max-width: 680px) {
      .overview-stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .view-header {
        display: none;
      }
      .view-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
        padding: 16px 14px;
        border-bottom: 2px solid #eef2f6;
        align-items: center;
      }
      .v-group {
        grid-column: 1 / 2;
        display: flex;
        align-items: center;
      }
      .v-checkin {
        grid-column: 2 / 3;
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }
      .v-id {
        display: none;
      }
      .mobile-only-id {
        display: inline-block;
        font-weight: 800;
        color: #1e293b;
        font-size: 15px;
        margin-left: 6px;
      }
      .v-name {
        grid-column: 1 / 3;
        font-size: 19px;
        font-weight: 800;
      }
      .v-lineup {
        grid-column: 1 / 2;
      }
      .v-rollcall {
        grid-column: 2 / 3;
      }
    }

    /* 即時日誌樣式 */
    .log-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .log-item:last-child {
      border-bottom: none;
    }
    .log-type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .badge-scan { background: #dbeafe; color: #1e40af; }
    .badge-walkin { background: #fae8ff; color: #86198f; }
    .badge-lineup { background: #e0f2fe; color: #0369a1; }
    .badge-rollcall { background: #dcfce7; color: #15803d; }
    .badge-lock { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 頂部標題資訊列 (無任何導向 rollcall.html 之按鈕，符合權限隔離) -->
    <div class="header-box">
      <div class="header-title">
        <span>📊 大會即時綜合檢視看板</span>
      </div>
      <div class="read-only-badge" id="syncStatusBadge">
        <span class="live-dot"></span>
        <span id="syncStatusText">純檢視模式 ｜ 0.1s 自動更新中</span>
      </div>
    </div>

    <!-- 階段篩選按鈕列 (支援第1階至第6階，並動態自適應試算表所有階數) -->
    <div class="stage-tabs-container">
      <div class="stage-tabs-label">📌 點選組別進行即時切換檢視：</div>
      <div class="stage-tabs-row" id="stageTabsRow">
        <button type="button" class="stage-tab-btn active" onclick="switchStage('all')">全部階數</button>
        <button type="button" class="stage-tab-btn" onclick="switchStage('第1階')">第1階</button>
        <button type="button" class="stage-tab-btn" onclick="switchStage('第2階')">第2階</button>
        <button type="button" class="stage-tab-btn" onclick="switchStage('第3階')">第3階</button>
        <button type="button" class="stage-tab-btn" onclick="switchStage('第4階')">第4階</button>
        <button type="button" class="stage-tab-btn" onclick="switchStage('第5階')">第5階</button>
        <button type="button" class="stage-tab-btn" onclick="switchStage('第6階')">第6階</button>
      </div>
    </div>

    <!-- 統計小方塊 -->
    <div class="overview-stats">
      <div class="stat-card">
        <div class="stat-label">此組總人數</div>
        <div class="stat-num" id="sTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已完成報到</div>
        <div class="stat-num" style="color:#16a34a;" id="sCheckedIn">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已整隊完成</div>
        <div class="stat-num" style="color:#2563eb;" id="sLineup">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已檢錄到位</div>
        <div class="stat-num" style="color:#059669;" id="sRollcall">0</div>
      </div>
    </div>

    <!-- 快速搜尋框 -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-bar" placeholder="🔍 輸入編號或姓名進行即時篩選..." oninput="renderTable()" />
    </div>

    <!-- 名單列表卡片 (純檢視，不可修改) -->
    <div class="content-card">
      <div class="view-row view-header">
        <div>組別</div>
        <div>編號</div>
        <div>姓名</div>
        <div>報到情況</div>
        <div style="text-align:center;">整隊</div>
        <div style="text-align:center;">檢錄</div>
      </div>

      <div id="tableBody">
        <div style="text-align:center; padding: 40px; color:#888;">資料同步連線中...</div>
      </div>
    </div>

    <!-- 即時活動日誌區塊 -->
    <div class="content-card" style="margin-top: 25px;">
      <div style="padding: 16px 20px; border-bottom: 2px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:bold; font-size:18px; color:#1e293b; display:flex; align-items:center; gap:8px;">
          <span>📜 大會即時作業日誌 (Live Log)</span>
          <span id="logCountBadge" style="font-size:12px; background:#e2e8f0; color:#475569; padding:2px 8px; border-radius:10px;">0 筆</span>
        </div>
        <button type="button" id="btnToggleLog" onclick="toggleLogPanel()" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:6px 12px; border-radius:10px; font-size:13px; font-weight:bold; cursor:pointer; color:#475569;">
          摺疊日誌
        </button>
      </div>
      <div id="logListContainer" style="max-height: 380px; overflow-y: auto; padding: 6px 10px;">
        <div style="text-align:center; padding: 25px; color:#94a3b8; font-size:14px;">尚無即時日誌紀錄</div>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_STAGES = ["第1階", "第2階", "第3階", "第4階", "第5階", "第6階"];

    // 階數數值解析器：支援「第1階」、「第2階」阿拉伯數字，亦相容中文數字
    function parseStageNumber(str) {
      if (!str) return 999;
      const mNum = str.match(/第?(\d+)/);
      if (mNum) return parseInt(mNum[1], 10);
      const cnNums = { '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
      const mCn = str.match(/第?([一二兩三四五六七八九十]+)/);
      if (mCn) {
        const s = mCn[1];
        let total = 0, temp = 0;
        for (let i = 0; i < s.length; i++) {
          const ch = s[i];
          if (cnNums[ch] !== undefined) temp = cnNums[ch];
          else if (ch === '十') {
            if (temp === 0) temp = 1;
            total += temp * 10;
            temp = 0;
          }
        }
        total += temp;
        return total > 0 ? total : 999;
      }
      return 999;
    }

    function compareStages(a, b) {
      const numA = parseStageNumber(a);
      const numB = parseStageNumber(b);
      if (numA !== numB) return numA - numB;
      return a.localeCompare(b, 'zh-Hant');
    }

    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwQnQrRL0rWlM50-KTjrx2iC8xtYTvoL9e-NL56EiDE7dU_SsgnGT-45eoY3apswwE1xA/exec";
    const API_URL = localStorage.getItem("CIP_GAS_URL") || DEFAULT_GAS_URL;

    let db = [];
    let activeStage = 'all'; // 預設全部，可點選 '第1階' ~ '第N階'
    let realTimeRecords = {};
    let liveCheckins = {};
    let lockedStages = {};
    let rtdb = null;
    let isLoadingData = false;

    // 初始化 Firebase 即時同步監聽
    function initFirebase() {
      if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) {
        rtdb = firebase.database();

        // 監聽 Firebase 網路連線狀態
        rtdb.ref('.info/connected').on('value', snap => {
          const isConnected = !!snap.val();
          const dot = document.querySelector('.live-dot');
          const txt = document.getElementById('syncStatusText');
          if (dot && txt) {
            if (isConnected) {
              dot.style.background = "#10b981";
            } else {
              dot.style.background = "#f59e0b";
              txt.innerText = "純檢視模式 ｜ 連線恢復中...";
            }
          }
        });

        // 1. 監聽各階鎖定狀態
        rtdb.ref('/lockedStages').on('value', snap => {
          lockedStages = snap.val() || {};
          updateStageTabs();
        });

        // 2. 監聽整隊與檢錄 (檢錄員在 rollcall_edit.html 點擊時，此處 0.1 秒即時更新)
        rtdb.ref('/records').on('value', snap => {
          realTimeRecords = snap.val() || {};
          renderTable();
        });

        // 3. 監聽門口報到狀態推播
        rtdb.ref('/checkins').on('value', snap => {
          liveCheckins = snap.val() || {};
          renderTable();
        });

        // 4. 監聽大會即時作業日誌 (/logs)
        rtdb.ref('/logs').limitToLast(30).on('value', snap => {
          renderLiveLogs(snap.val() || {});
        });
      }
    }

    // 摺疊 / 展開即時日誌
    function toggleLogPanel() {
      const p = document.getElementById('logListContainer');
      const btn = document.getElementById('btnToggleLog');
      if (p.style.display === 'none') {
        p.style.display = 'block';
        btn.innerText = '摺疊日誌';
      } else {
        p.style.display = 'none';
        btn.innerText = '展開日誌';
      }
    }

    // 渲染大會即時作業日誌
    function renderLiveLogs(logsObj) {
      const container = document.getElementById('logListContainer');
      const badge = document.getElementById('logCountBadge');
      if (!container) return;

      const keys = Object.keys(logsObj);
      if (!keys.length) {
        container.innerHTML = `<div style="text-align:center; padding:25px; color:#94a3b8; font-size:14px;">尚無即時日誌紀錄</div>`;
        if (badge) badge.innerText = "0 筆";
        return;
      }

      const list = keys.map(k => logsObj[k]).sort((a, b) => {
        return (b.timestamp || '').localeCompare(a.timestamp || '');
      });

      if (badge) badge.innerText = `${list.length} 筆`;

      let html = "";
      list.forEach(item => {
        let badgeClass = "badge-scan";
        if (item.actionType === "臨時報到") badgeClass = "badge-walkin";
        else if (item.actionType === "整隊作業") badgeClass = "badge-lineup";
        else if (item.actionType === "檢錄作業") badgeClass = "badge-rollcall";
        else if (item.actionType === "階段鎖定") badgeClass = "badge-lock";

        const tStr = item.timeStr || (item.timestamp ? item.timestamp.split('T')[1].split('.')[0] : '');

        html += `
          <div class="log-item">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="log-type-badge ${badgeClass}">${item.actionType || '日誌'}</span>
              <span style="font-size:12px; color:#64748b;">${tStr}</span>
            </div>
            <div style="font-size:14px; font-weight:bold; color:#1e293b; margin-top:2px;">
              ${item.idNo ? `[${item.idNo}] ` : ''}${item.name ? item.name + ' ' : ''}${item.groupName ? `(${item.groupName}) ` : ''}➔ <span style="color:#0284c7;">${item.result || ''}</span>
            </div>
            ${item.note ? `<div style="font-size:12px; color:#64748b;">${item.note}</div>` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 動態更新階段按鈕標籤與鎖定標示
    function updateStageTabs() {
      const container = document.getElementById('stageTabsRow');
      if (!container) return;
      const stageSet = new Set(DEFAULT_STAGES);
      db.forEach(r => {
        if (r[1] && String(r[1]).trim() !== "") {
          stageSet.add(String(r[1]).trim());
        }
      });
      const stages = Array.from(stageSet).sort(compareStages);

      let html = `<button type="button" class="stage-tab-btn ${activeStage === 'all' ? 'active' : ''}" onclick="switchStage('all')">全部階數</button>`;
      stages.forEach(stage => {
        const isLocked = !!lockedStages[stage];
        const isActive = (activeStage === stage);
        const lockPrefix = isLocked ? "🔒 " : "";
        const lockedClass = isLocked ? "is-locked" : "";
        const activeClass = isActive ? "active" : "";
        html += `<button type="button" class="stage-tab-btn ${activeClass} ${lockedClass}" onclick="switchStage('${stage}')">${lockPrefix}${stage}</button>`;
      });
      container.innerHTML = html;
    }

    // 切換階段篩選
    function switchStage(stage) {
      activeStage = stage;
      updateStageTabs();
      renderTable();
    }

    // 載入基本名冊 (支援背景定時自動刷新)
    async function loadData(isBackground = false) {
      if (isLoadingData) return;
      isLoadingData = true;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getAdminData" })
        });
        const result = await res.json();
        if (result.success && Array.isArray(result.data)) {
          db = result.data;
          updateStageTabs();
          renderTable();
          const nowStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
          const txt = document.getElementById('syncStatusText');
          if (txt) {
            txt.innerText = `純檢視模式 ｜ 0.1s 自動同步中 (${nowStr})`;
          }
        }
      } catch (err) {
        console.warn("載入名冊失敗:", err);
      } finally {
        isLoadingData = false;
      }
    }

    // 渲染純檢視表格
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const keyword = document.getElementById('searchInput').value.trim().toUpperCase();

      if (!db.length) {
        tbody.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">載入名冊資料中...</div>`;
        return;
      }

      let countTotal = 0;
      let countCheckedIn = 0;
      let countLineup = 0;
      let countRollcall = 0;

      let html = "";

      db.forEach(r => {
        const idNo = (r[0] !== undefined && r[0] !== null) ? String(r[0]).trim() : '-';
        const groupName = (r[1] !== undefined && r[1] !== null) ? String(r[1]).trim() : '-';
        const name = (r[3] !== undefined && r[3] !== null) ? String(r[3]).trim() : '-';

        // 報到狀態 (支援 Google Sheets 與 Firebase 即時雙軌比對)
        const hasSheetCheckin = !!(r[5] && String(r[5]).trim() !== "");
        const live = liveCheckins[idNo] || liveCheckins[idNo.toUpperCase()] || {};
        const liveTime = live.time ? String(live.time) : '';
        const checkInStr = String(r[5] || liveTime).trim();
        const isLate = checkInStr.includes("過號") || !!live.isLate;
        const hasLiveCheckin = !!live.checkedIn;
        const isCheckedIn = hasSheetCheckin || hasLiveCheckin || isLate;

        // 階數過濾 (第6階自動納入原第6階以及所有「過號」之受獎人)
        if (activeStage !== 'all') {
          if (activeStage === '第6階') {
            const isStage6 = (groupName === '第6階');
            if (!isStage6 && !isLate) return;
          } else {
            if (groupName !== activeStage) return;
          }
        }

        countTotal++;

        // 整隊與檢錄狀態 (比對 idNo)
        const rec = realTimeRecords[idNo] || realTimeRecords[idNo.toUpperCase()] || {};
        const isLineup = !!rec.lineup;
        const isRollcall = !!rec.rollcall;

        if (isCheckedIn) countCheckedIn++;
        if (isLineup) countLineup++;
        if (isRollcall) countRollcall++;

        // 關鍵字比對
        if (keyword !== "") {
          const match = String(idNo).toUpperCase().includes(keyword) || 
                        String(name).toUpperCase().includes(keyword) ||
                        String(groupName).toUpperCase().includes(keyword);
          if (!match) return;
        }

        let checkinHtml = "";
        let lateTag = "";

        if (isLate) {
          checkinHtml = `<span class="badge-checkin-yes" style="background:#fef3c7; color:#92400e; border:1px solid #fde68a; white-space:nowrap;">過號報到(移至第6階)</span>`;
          if (groupName !== '第6階') {
            lateTag = `<span style="font-size:11px; background:#fef3c7; color:#92400e; padding:2px 6px; border-radius:6px; font-weight:bold; border:1px solid #fde68a; margin-left:4px;">原${groupName}</span>`;
          }
        } else if (isCheckedIn) {
          checkinHtml = `<span class="badge-checkin-yes">已報到</span>`;
        } else {
          checkinHtml = `<span class="badge-checkin-no">未報到</span>`;
        }

        // 依需求純檢視：不可點擊修改
        const lineupHtml = isLineup 
          ? `<span class="v-badge-done">✅ 已整隊</span>` 
          : `<span class="v-badge-empty">⬜ 未整隊</span>`;

        const rollcallHtml = isRollcall 
          ? `<span class="v-badge-done">✅ 已檢錄</span>` 
          : `<span class="v-badge-empty">⬜ 未檢錄</span>`;

        html += `
          <div class="view-row">
            <!-- 第 1 欄：組別 (手機版含小編號標籤) -->
            <div class="v-group">
              <span class="badge-group">${groupName}</span>
              <span class="mobile-only-id">#${idNo}</span>
            </div>

            <!-- 第 2 欄：編號 (桌面版獨立欄位) -->
            <div class="v-id">#${idNo}</div>

            <!-- 第 3 欄：姓名 (含過號標籤) -->
            <div class="v-name">${name}${lateTag}</div>

            <!-- 第 4 欄：報到情況 -->
            <div class="v-checkin">${checkinHtml}</div>

            <!-- 第 5 欄：整隊狀態 (純檢視) -->
            <div class="v-lineup">${lineupHtml}</div>

            <!-- 第 6 欄：檢錄狀態 (純檢視) -->
            <div class="v-rollcall">${rollcallHtml}</div>
          </div>
        `;
      });

      document.getElementById('sTotal').innerText = countTotal;
      document.getElementById('sCheckedIn').innerText = countCheckedIn;
      document.getElementById('sLineup').innerText = countLineup;
      document.getElementById('sRollcall').innerText = countRollcall;

      tbody.innerHTML = html || `<div style="text-align:center; padding:35px; color:#888;">無符合條件的名單資料</div>`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
      loadData();

      // 自動背景輪詢：每 3 秒自動向試算表同步一次，完全不需手動重新整理
      setInterval(() => {
        loadData(true);
      }, 3000);
    });
  </script>
</body>
</html>
